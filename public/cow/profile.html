  </main>

  <script>
    async function loadCowProfile() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) {
        document.getElementById("loading").innerText = "No cow ID provided.";
        return;
      }

      try {
        const res = await fetch(`/api/cow/${id}`);
        if (!res.ok) throw new Error("Cow not found");
        const cow = await res.json();

        // Hide loader, show profile
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("profile").classList.remove("hidden");

        // Fill data
        document.getElementById("cow-name").innerText = cow.name || "Unknown";
        document.getElementById("cow-tag").innerText = `Tag: ${cow.tagNumber || "N/A"}`;
        document.getElementById("cow-breed").innerText = cow.breed || "N/A";
        document.getElementById("cow-birth").innerText = cow.birthDate ? new Date(cow.birthDate).toLocaleDateString() : "N/A";
        document.getElementById("cow-health").innerText = cow.healthStatus || "Healthy";
        document.getElementById("cow-owner").innerText = cow.ownerName || "N/A";
        document.getElementById("cow-contact").innerText = cow.ownerContact || "N/A";
        document.getElementById("cow-address").innerText = cow.address || "N/A";
        document.getElementById("cow-medical").innerText = cow.medicalHistory || "None";
        document.getElementById("cow-medications").innerText = cow.currentMedications || "None";
        document.getElementById("cow-vaccinations").innerText = cow.vaccinations?.map(v => v.name).join(", ") || "None";
        document.getElementById("cow-pregnancy").innerText = cow.pregnancyStatus || "N/A";
        document.getElementById("cow-breeding").innerText = cow.breedingDate ? new Date(cow.breedingDate).toLocaleDateString() : "N/A";
        document.getElementById("cow-calving").innerText = cow.expectedCalving ? new Date(cow.expectedCalving).toLocaleDateString() : "N/A";

        // Generate QR Code
        const qrUrl = `https://cowtrack.onrender.com/cow/profile.html?id=${cow._id}`;
        QRCode.toCanvas(document.getElementById("qr-code"), qrUrl, { width: 160 });
      } catch (err) {
        document.getElementById("loading").innerText = "Error loading cow data.";
        console.error(err);
      }
    }

    document.addEventListener("DOMContentLoaded", loadCowProfile);
  </script>
